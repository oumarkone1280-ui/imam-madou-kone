name: imam_madou_kone
description: "Application officielle de l'Imam Madou Koné"
publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.13
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/IMG/
    - assets/Sermons/